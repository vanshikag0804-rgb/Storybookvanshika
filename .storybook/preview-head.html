<!-- Google Analytics 4 (GA4) Tracking -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MEASUREMENT_ID"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-MEASUREMENT_ID', {
    send_page_view: true
  });

  // Event listeners to track story route navigation
  function trackStoryNavigation() {
    var storyId = window.location.hash || window.location.search;
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_title: document.title,
        page_location: window.location.href,
        page_path: storyId || '/storybook'
      });
    }
  }

  window.addEventListener('hashchange', trackStoryNavigation);
  window.addEventListener('popstate', trackStoryNavigation);
</script>

  body {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
</style>
